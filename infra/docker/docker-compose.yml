# Local development stack. App runs on the host (Herd / artisan serve / octane);
# this provides the data plane only.
name: calorielens

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: calorielens
      POSTGRES_USER: calorielens
      POSTGRES_PASSWORD: secret
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../docs/03-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calorielens"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: calorielens
      MINIO_ROOT_PASSWORD: secret123
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  createbuckets:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 calorielens secret123 &&
                  mc mb -p local/media local/exports && exit 0"

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  minio:
