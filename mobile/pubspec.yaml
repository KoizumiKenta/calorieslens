name: calorielens
description: CalorieLens AI — snap a photo, know your meal.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

# v1 is deliberately codegen-free so the app builds on a fresh machine with
# zero build_runner steps and runs on web (Chrome) with no Xcode/Android SDK.
# Persistence sits behind repository interfaces (core/data/*) — Drift replaces
# the shared_preferences impl when we target devices, without touching feature
# code. Native-only plugins (camera, mobile_scanner, record, health) join then
# too. The full device-build dependency set is preserved in
# reference/pubspec.full.yaml.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  http: ^1.2.0
  shared_preferences: ^2.3.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
