name: calorielens
description: CalorieLens AI — snap a photo, know your meal.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

# v1 is deliberately codegen-free so the app builds on a fresh machine with
# zero build_runner steps and runs on web (Chrome) with no Xcode/Android SDK.
# Persistence sits behind repository interfaces (core/data/*) — Drift replaces
# the shared_preferences impl when we target devices, without touching feature
# code. Native-only plugins (camera, mobile_scanner, record, health) join then
# too. The full device-build dependency set is preserved in
# reference/pubspec.full.yaml.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  http: ^1.2.0
  shared_preferences: ^2.3.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  uuid: ^4.4.0
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

# Launcher icon — green brand fill, viewfinder + cutlery glyph. Android uses an
# adaptive icon (green background + transparent foreground); web/others use the
# full square. Regenerate: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/branding/icon_full.png"
  android: true
  adaptive_icon_background: "#2E7D4F"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/branding/icon_full.png"
    background_color: "#2E7D4F"
    theme_color: "#2E7D4F"

# Native splash — green background, white logo centered. Regenerate:
# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#2E7D4F"
  image: "assets/branding/splash_logo.png"
  android: true
  web: false
  android_12:
    color: "#2E7D4F"
    image: "assets/branding/splash_logo.png"
