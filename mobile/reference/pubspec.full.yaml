name: calorielens
description: CalorieLens AI — point, shoot, logged.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & DI
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0

  # Navigation
  go_router: ^14.6.0

  # Networking & realtime
  dio: ^5.7.0
  web_socket_channel: ^3.0.0
  connectivity_plus: ^6.1.0

  # Offline-first storage
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.26
  flutter_secure_storage: ^9.2.0
  path_provider: ^2.1.5

  # Capture
  camera: ^0.11.0
  mobile_scanner: ^6.0.0
  record: ^5.2.0
  image: ^4.3.0

  # Health platforms
  health: ^11.1.0

  # UI
  lottie: ^3.2.0
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0

  # Utilities
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  intl: ^0.19.0
  uuid: ^4.5.0
  workmanager: ^0.5.2
  sentry_flutter: ^8.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.0
  riverpod_generator: ^2.6.0
  drift_dev: ^2.22.0
  freezed: ^2.5.0
  json_serializable: ^6.9.0
  golden_toolkit: ^0.15.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true   # l10n: ARB files in lib/core/l10n (en, ms, zh, id, th)
  assets:
    - assets/lottie/
    - assets/images/
